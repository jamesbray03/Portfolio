    <main class="contact-main">
        <div class="page-head">
            <p class="kicker">Comms</p>
            <h1>Contact Me</h1>
            <p class="page-sub">Let's work together, or just say hi!</p>
            <span class="status-line"><span class="status-dot"></span>Available for contracts</span>
        </div>

        <form class="contact-form" action="https://formsubmit.co/jamesbray03@protonmail.com" method="POST">
            <div class="form-field">
                <label for="cf-name" class="mono-label">Name</label>
                <input id="cf-name" type="text" name="name" placeholder="Your Name" required>
            </div>
            <div class="form-field">
                <label for="cf-email" class="mono-label">Email</label>
                <input id="cf-email" type="email" name="email" placeholder="Your Email" required>
            </div>
            <div class="form-field">
                <label for="cf-message" class="mono-label">Message</label>
                <textarea id="cf-message" name="message" rows="6" placeholder="Your Message" required></textarea>
            </div>
            <input type="hidden" name="_captcha" value="false">
            <button type="submit" class="button">Send Message</button>
        </form>

        <p class="contact-alt">or connect with me on <a href="https://www.linkedin.com/in/jamesbray03/" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
    </main>
